name: Deploy 海纳百川-播放器

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: m3u-player-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site
        run: |
          mkdir -p public/player public/examples public/docs
          cp index.html public/index.html
          cp -r player/. public/player/
          cp examples/*.html public/examples/
          cp docs/*.md public/docs/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
